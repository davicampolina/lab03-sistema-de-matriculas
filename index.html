<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema de Matrículas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="pagina-login d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-mortarboard-fill display-4 text-primary"></i>
              <h1 class="h4 mt-2 mb-0">Sistema de Matrículas</h1>
              <p class="text-muted small">Acesse com seu e-mail e senha</p>
            </div>

            <div id="alerta"></div>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="nome@universidade.edu.br" required autocomplete="username">
                </div>
              </div>
              <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="senha" placeholder="Sua senha" required autocomplete="current-password">
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="btnEntrar">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
              </button>
            </form>
          </div>
        </div>
        <p class="text-center text-muted small mt-3">Engenharia de Software &middot; DIW &middot; PUC Minas</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
