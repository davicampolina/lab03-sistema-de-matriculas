<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Professor | Sistema de Matrículas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="professor.html"><i class="bi bi-mortarboard-fill me-2"></i>Matrículas</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small d-none d-sm-inline"><i class="bi bi-person-circle me-1"></i><span id="nomeUsuario"></span></span>
        <button class="btn btn-outline-light btn-sm" id="btnSair"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div>
        <h1 class="h3 mb-0">Área do Professor</h1>
        <p class="text-muted mb-0">Alunos matriculados nas disciplinas que você leciona</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label for="filtroSemestre" class="form-label mb-0 small text-muted">Semestre</label>
        <select class="form-select form-select-sm w-auto" id="filtroSemestre"></select>
      </div>
    </div>

    <div id="alerta"></div>

    <div class="accordion" id="listaDisciplinas"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/professor.js"></script>
</body>
</html>
