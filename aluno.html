<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno | Sistema de Matrículas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="aluno.html"><i class="bi bi-mortarboard-fill me-2"></i>Matrículas</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small d-none d-sm-inline"><i class="bi bi-person-circle me-1"></i><span id="nomeUsuario"></span></span>
        <button class="btn btn-outline-light btn-sm" id="btnSair"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <div>
        <h1 class="h3 mb-0">Área do Aluno</h1>
        <p class="text-muted mb-0" id="infoAluno"></p>
      </div>
      <div id="infoPeriodo"></div>
    </div>

    <div id="alerta"></div>

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card card-resumo h-100">
          <div class="card-body">
            <p class="text-muted small mb-1">Obrigatórias (1ª opção)</p>
            <p class="h4 mb-0"><span id="qtdObrigatorias">0</span> / 4</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card card-resumo h-100">
          <div class="card-body">
            <p class="text-muted small mb-1">Optativas (alternativas)</p>
            <p class="h4 mb-0"><span id="qtdOptativas">0</span> / 2</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card card-resumo h-100">
          <div class="card-body">
            <p class="text-muted small mb-1">Valor do semestre</p>
            <p class="h4 mb-0" id="valorSemestre">R$ 0,00</p>
          </div>
        </div>
      </div>
    </div>

    <section class="card mb-4">
      <div class="card-header bg-white">
        <h2 class="h5 mb-0"><i class="bi bi-journal-check me-2"></i>Minhas matrículas</h2>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Disciplina</th>
                <th>Professor</th>
                <th>Tipo</th>
                <th>Situação da disciplina</th>
                <th>Valor</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaMatriculas"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h2 class="h5 mb-0"><i class="bi bi-list-ul me-2"></i>Disciplinas ofertadas</h2>
        <input type="search" class="form-control form-control-sm w-auto" id="filtroOfertas" placeholder="Buscar disciplina...">
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Disciplina</th>
                <th>Professor</th>
                <th>Créditos</th>
                <th>Valor</th>
                <th>Vagas</th>
                <th class="text-end">Matricular como</th>
              </tr>
            </thead>
            <tbody id="tabelaOfertas"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/aluno.js"></script>
</body>
</html>
